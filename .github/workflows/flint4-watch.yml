name: flint4 watch
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: force the security alert path (test)
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency: flint4-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flint4-main
          fetch-depth: 300
          fetch-tags: true
      - name: fetch upstream main
        run: |
          git remote add upstream https://github.com/openwrt/openwrt.git
          git fetch -q --depth=3000 upstream main
          git merge-base HEAD upstream/main >/dev/null || { git fetch -q --deepen=5000 upstream main; git fetch -q --deepen=2000 origin flint4-main; }
      - name: report
        run: bash .flint4/watch.sh && cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: post to the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # REST only (the GraphQL path used by gh issue create/list is not available to the job token here)
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=flint4-watch&state=open&per_page=1" --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            n=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="flint4 watch: upstream changes since the last image" -f body="Daily report from the flint4 watch workflow lands here as comments." -f 'labels[]=flint4-watch' --jq .number)
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$n/comments" -F body=@report.md --jq .html_url
          awk '/^### security-flagged/{p=1} /^### /&&!/security-flagged/{p=0} p' report.md | grep -qE '^- ' && echo "::warning::security-flagged upstream commits since the last image" || true
      - name: alert (mention = email/push notification)
        env:
          GH_TOKEN: ${{ github.token }}
          TEST: ${{ inputs.test_alert }}
          STALE_DAYS: "7"
        run: |
          # two alert reasons: (a) security-flagged commits in either security section -> alert at once;
          # (b) accumulation: anything changed in our areas or our packages AND the last image is older than STALE_DAYS.
          sec=$(awk '/^### security-flagged/{p=1} /^### /&&!/security-flagged/{p=0} p' report.md | grep -E '^- ' || true)
          routine=$(awk '/^### upstream main: commits since our base/{p=1} /^### security-flagged subjects/{p=0} p; /^### feeds:/{q=1} /^### security-flagged: feed/{q=0} q' report.md | grep -E '^- ' || true)
          LASTTAG=$(git tag -l 'r[0-9]*' --sort=-v:refname | head -1)
          age_days=$(( ( $(date -u +%s) - $(git log -1 --format=%ct "$LASTTAG") ) / 86400 ))
          [ "$TEST" = "true" ] && sec="- 0000000000 $(date -u +%F) TEST: alert path check (ignore)"
          reason=""; body=""
          if [ -n "$sec" ]; then reason="security"; body=$(printf '@%s security-flagged upstream commits since image %s (%s days old):\n\n%s\n\nRun: %s/%s/actions/runs/%s' "$GITHUB_REPOSITORY_OWNER" "$LASTTAG" "$age_days" "$sec" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          elif [ -n "$routine" ] && [ "$age_days" -ge "$STALE_DAYS" ]; then reason="stale"; body=$(printf '@%s image %s is %s days old and upstream changed things we ship since then; a routine rebuild is due:\n\n%s\n\nRun: %s/%s/actions/runs/%s' "$GITHUB_REPOSITORY_OWNER" "$LASTTAG" "$age_days" "$(echo "$routine" | head -25)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"); fi
          A=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=flint4-security&state=open&per_page=1" --jq '.[0].number // empty')
          if [ -n "$reason" ]; then
            title="flint4: rebuild advised ($reason) since image $LASTTAG"
            if [ -z "$A" ]; then
              gh api "repos/$GITHUB_REPOSITORY/labels/flint4-security" >/dev/null 2>&1 || gh api -X POST "repos/$GITHUB_REPOSITORY/labels" -f name=flint4-security -f color=b60205 -f description="rebuild advised (security flag or stale image)" >/dev/null
              A=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -f body="$body" -f 'labels[]=flint4-security' --jq .number); echo "opened alert issue #$A ($reason)"
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$A/comments" -f body="$body" >/dev/null; echo "updated alert issue #$A ($reason)"
            fi
            echo "::warning::rebuild advised ($reason): image $LASTTAG is $age_days days old"
          elif [ -n "$A" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$A/comments" -f body="Clear: image $LASTTAG covers it. Closing." >/dev/null
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$A" -f state=closed >/dev/null; echo "closed alert issue #$A"
          else echo "no alert: image $LASTTAG is $age_days days old, nothing security-flagged"; fi
